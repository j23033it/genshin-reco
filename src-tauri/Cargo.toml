[package]
name = "genshin-reco"
version = "0.1.0"
description = "原神の根拠付き・編成連動ビルド推薦デスクトップアプリ"
authors = ["taiki"]
edition = "2024"
default-run = "genshin-reco"

[lib]
# Windowsではライブラリ名とバイナリ名を分ける必要がある。
name = "genshin_reco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
semver = "1"
schemars = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
