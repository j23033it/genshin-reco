[package]
name = "genshin-reco"
version = "0.1.0"
description = "原神の根拠付き・編成連動ビルド推薦デスクトップアプリ"
authors = ["taiki"]
edition = "2024"

[lib]
# Windowsではライブラリ名とバイナリ名を分ける必要がある。
name = "genshin_reco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

